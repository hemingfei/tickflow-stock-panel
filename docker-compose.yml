services:
  app:
    image: tickflow-stock-panel:latest
    container_name: tickflow-stock-panel
    restart: unless-stopped
    ports:
      - "3018:3018"
    volumes:
      - ./data:/app/data
      - ./tiers.yaml:/app/tiers.yaml:ro
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
